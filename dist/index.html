<body><h1>Spirograph</h1><canvas></canvas><div class="controls"><button id="render">Render</button><p>Rolling circle radius as a % of larger circle</p><input type="range" min="1" max="100" value="50" class="slider" id="radius_slider"><span id="radius_label">50</span><p>Proximity of Pen to Radius of inner circle</p><input type="range" min="1" max="100" value="100" class="slider" id="pen_pos_slider"><span id="pen_pos_label">100</span><p>Rotations around larger circle</p><input type="range" min="1" max="100" value="1" class="slider" id="rotations_slider"><span id="rotations_label">1</span></div><style>body{background-color:black;color:white}canvas{width:400px;height:400px;outline:1px solid white}button{width:400px;height:30px;background-color:black;color:white;cursor:pointer}</style><script>const e=document.querySelector("canvas");e.width=400,e.height=400;const t=e.getContext("2d");t.fillStyle="rgb(255, 255, 255)";let n=100,r=20,o=1,l=1;const c=document.querySelector("#radius_slider");c.addEventListener("input",()=>{document.querySelector("#radius_label").innerText=c.value,r=n*c.value/100});const u=document.querySelector("#pen_pos_slider");u.addEventListener("input",()=>{document.querySelector("#pen_pos_label").innerText=u.value,o=u.value/100});const i=document.querySelector("#rotations_slider");function a(e){return Math.floor((n-r)*Math.cos(e)+r*o*Math.cos((n-r)*e/r)+200)}function d(e){return Math.floor((n-r)*Math.sin(e)-r*o*Math.sin((n-r)*e/r)+200)}function s(){t.clearRect(0,0,e.width,e.height);for(let e=0;e<2*l*Math.PI;e+=Math.PI/1e3){const n=a(e),r=d(e);t.fillRect(n,r,1,1)}}i.addEventListener("input",()=>{document.querySelector("#rotations_label").innerText=i.value,l=i.value}),document.querySelector("#render").addEventListener("click",()=>{s()}),s();</script></body>
